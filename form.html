<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Review Form</title>
  <meta name="description" content="Create a product review form page. Apply good form design principles, meet specific field requirements, and include a submission confirmation with a counter. The form must be user-friendly on both mobile and desktop screens.">
  <meta name="author" content="Devin Gamboa Enciso">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form method="get" action="review.html">
            <label for="productName">Product Name</label>
            <select id="productName" name="productName" required>
                <option value="" disabled selected>Choose a Product ...</option>
            </select>

            <fieldset class="rating">
                <legend>Overall Rating</legend>

                <div>
                    <label for="rating1">☆</label>
                    <input type="radio" id="rating1" name="rating" value="1" required>
                </div>
                
                <div>
                    <label for="rating2">☆☆</label>
                    <input type="radio" id="rating2" name="rating" value="2" required>
                </div>
                
                <div>
                    <label for="rating3">☆☆☆</label>
                    <input type="radio" id="rating3" name="rating" value="3" required>
                </div>
        
                <div>
                    <label for="rating4">☆☆☆☆</label>
                    <input type="radio" id="rating4" name="rating" value="4" required>
                </div>
                
                <div>
                    <label for="rating5">☆☆☆☆☆</label>
                    <input type="radio" id="rating5" name="rating" value="5" required>
                </div>
            </fieldset>
            
            <label for="installationDate">Date of Installation</label>
            <input type="date" id="installationDate" name="installationDate" required>
        
            <fieldset class="features">
                <legend>Which of the features did you find useful in this product?</legend>
                <p>(Check all that apply)</p>

                <label for="durability">
                    <input type="checkbox" id="durability" name="features" value="Durability">
                    Durability
                </label>

                <label for="easeOfuse">
                    <input type="checkbox" id="easeOfuse" name="features" value="Ease of use">
                    Ease of use
                </label>

                <label for="performance">
                    <input type="checkbox" id="performance" name="features" value="Performance">
                    Performance
                </label>

                <label for="design">
                    <input type="checkbox" id="design" name="features" value="Design">
                    Design
                </label>
            </fieldset>

            <label for="writtenReview">
                Written review <span class="optional">(Optional)</span>
            </label>
            <textarea id="writtenReview" name="writtenReview"></textarea>

            <label for="userName">
                Your Name <span class="optional">(Optional)</span>
            </label>
            <input type="text" id="userName" name="userName">

            <input type="submit" value="Post Review">
            
        </form>
    </main>
    <footer>
        <p>&copy;<span id="currentyear"></span> Devin Gamboa Enciso | Huanta, Perú ❤️🤍❤️</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
